<script>
// --- DENMARK CLOCK SCRIPT ---
function updateClock() {
    const options = { timeZone: 'Europe/Copenhagen', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
    document.getElementById('clock').textContent = new Intl.DateTimeFormat('en-GB', options).format(new Date());
}
setInterval(updateClock, 1000);
updateClock();

// --- TIMER LOGIC ---
let totalSeconds = 0, initialSeconds = 0, timerInterval = null, selectedMinutes = 0;

function toggleService(btn) {
    if (timerInterval) return; 
    const minutes = parseInt(btn.getAttribute('data-time'));
    if (btn.classList.contains('selected')) {
        btn.classList.remove('selected');
        selectedMinutes -= minutes;
    } else {
        btn.classList.add('selected');
        selectedMinutes += minutes;
    }
    updateTimerDisplay(selectedMinutes * 60);
}

function updateTimerDisplay(secs) {
    const mins = Math.floor(secs / 60);
    const s = secs % 60;
    document.getElementById('active-timer-display').textContent = `${String(mins).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function startTimer() {
    if (selectedMinutes <= 0 || timerInterval) return;
    totalSeconds = selectedMinutes * 60;
    initialSeconds = totalSeconds;
    const startBtn = document.getElementById('start-btn');
    startBtn.style.opacity = '0.5'; startBtn.disabled = true;

    timerInterval = setInterval(() => {
        if (totalSeconds <= 0) {
            clearInterval(timerInterval);
            timerInterval = null;
            document.getElementById('finish-sound').play();
            alert("Service Complete!");
            manualReset();
            return;
        }
        totalSeconds--;
        updateTimerDisplay(totalSeconds);
        const percentage = (totalSeconds / initialSeconds) * 100;
        document.getElementById('progress-bar').style.width = percentage + "%";
        if (percentage < 20) {
            document.getElementById('progress-bar').style.backgroundColor = "#ff4d4d";
            document.getElementById('active-timer-display').style.color = "#ff4d4d";
        }
    }, 1000);
}

function manualReset() {
    clearInterval(timerInterval); timerInterval = null; selectedMinutes = 0; totalSeconds = 0;
    const startBtn = document.getElementById('start-btn');
    startBtn.style.opacity = '1'; startBtn.disabled = false;
    document.getElementById('active-timer-display').style.color = '#d4af37';
    document.getElementById('progress-bar').style.backgroundColor = '#d4af37';
    document.getElementById('progress-bar').style.width = '0%';
    document.querySelectorAll('.service-btn').forEach(btn => btn.classList.remove('selected'));
    updateTimerDisplay(0);
}

// --- NEW YOUTUBE LIVE STREAM (Lofi Girl) ---
var player;
var tag = document.createElement('script');
tag.src = "https://www.youtube.com/iframe_api";
var firstScriptTag = document.getElementsByTagName('script')[0];
firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

function onYouTubeIframeAPIReady() {
    player = new YT.Player('yt-player', {
        height: '0', width: '0',
        videoId: 'jfKfPfyJRdk', // Lofi Girl Radio - Non-stop variety
        playerVars: { 
            'autoplay': 0, 
            'controls': 0, 
            'disablekb': 1,
            'modestbranding': 1
        },
        events: { 'onStateChange': onPlayerStateChange }
    });
}

function onPlayerStateChange(event) {
    const btn = document.getElementById('play-pause-btn');
    if (event.data == YT.PlayerState.PLAYING) { btn.textContent = '⏸'; } 
    else { btn.textContent = '▶'; }
}

function toggleMusic() {
    if (!player || typeof player.getPlayerState !== 'function') return;
    const state = player.getPlayerState();
    if (state == YT.PlayerState.PLAYING) { player.pauseVideo(); } 
    else { player.playVideo(); }
}
</script>
