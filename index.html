<!-- Background Music Player -->
<div class="music-control">
  <button id="musicBtn" onclick="toggleMusic()" aria-label="Toggle music">
    <span id="playIcon">▶</span>
    <span id="musicLabel">BACKGROUND MUSIC</span>
  </button>
  <iframe id="musicFrame" style="display:none" allow="autoplay" src="https://www.youtube.com/embed/jfKfPfyJRdk?autoplay=0&loop=1&playlist=jfKfPfyJRdk" frameborder="0"></iframe>
</div>

<script>
let isPlaying = false;
const musicBtn = document.getElementById('musicBtn');
const musicFrame = document.getElementById('musicFrame');
const playIcon = document.getElementById('playIcon');

function toggleMusic() {
  if (isPlaying) {
    musicFrame.src = 'https://www.youtube.com/embed/jfKfPfyJRdk?autoplay=0&loop=1&playlist=jfKfPfyJRdk';
    playIcon.textContent = '▶';
    musicBtn.classList.remove('playing');
    isPlaying = false;
  } else {
    musicFrame.src = 'https://www.youtube.com/embed/jfKfPfyJRdk?autoplay=1&loop=1&playlist=jfKfPfyJRdk';
    playIcon.textContent = '⏸';
    musicBtn.classList.add('playing');
    isPlaying = true;
  }
}
</script>
